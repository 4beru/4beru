name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Avoid simultaneous attempts to update the same generated SVG.
concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generar Achievements
        # Maintained community fork with Projects V2 GraphQL support.
        # Pin the action and build from this revision, not an unrelated prebuilt image.
        uses: gh-metrics/metrics@0252603d89e89b96f0413c3cb6b0649b64387ba9
        with:
          filename: github-achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: no
          plugins_errors_fatal: yes
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_only: developer, forker, stargazer, deployer
